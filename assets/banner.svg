<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="52%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <circle cx="1075" cy="36" r="170" fill="#1D4ED8" opacity="0.09"/>
  <circle cx="115" cy="310" r="180" fill="#3B82F6" opacity="0.06"/>
  <path d="M0 270 C250 210 350 330 600 270 S950 210 1200 275 V330 H0 Z" fill="#2563EB" opacity="0.08"/>

  <rect x="72" y="64" width="112" height="112" rx="30" fill="#0B1220" stroke="#60A5FA" stroke-width="2"/>
  <text x="128" y="137" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="46" font-weight="700">LL</text>

  <text x="220" y="112" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="54" font-weight="750">Luis Loayza</text>
  <rect x="222" y="134" width="455" height="4" rx="2" fill="url(#accent)"/>
  <text x="220" y="178" fill="#93C5FD" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">Fullstack Developer · UI/UX · Data e Inteligencia Artificial</text>
  <text x="220" y="218" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="19">Bachiller en Ingeniería Informática y Sistemas</text>
  <text x="220" y="252" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="17">Diseño y desarrollo de productos digitales modernos, funcionales y escalables.</text>

  <g transform="translate(910 222)">
    <rect width="212" height="46" rx="23" fill="#111827" stroke="#334155"/>
    <circle cx="26" cy="23" r="6" fill="#22C55E" filter="url(#glow)"/>
    <text x="45" y="29" fill="#E2E8F0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Disponible para colaborar</text>
  </g>
