<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Luis Loayza — Fullstack Developer</title>
  <desc id="description">Portada animada del perfil profesional de Luis Loayza con su avatar, especializado en producto, interfaces y tecnología.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="10" x2="1160" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="28"/></clipPath>
    <clipPath id="avatar"><circle cx="130" cy="126" r="52"/></clipPath>
  </defs>
  <style>
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .cursor { animation: cursor 1s steps(1, end) infinite; }
    .signal { animation: signal 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .line { animation: line 3.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; transform: scale(.82); } }
    @keyframes cursor { 50% { opacity: 0; } }
    @keyframes signal { 0% { opacity: 0; transform: scale(.7); } 35% { opacity: .35; } 100% { opacity: 0; transform: scale(1.55); } }
    @keyframes line { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .cursor, .signal, .line { animation: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <circle cx="1090" cy="8" r="190" fill="#2563EB" opacity=".08"/>
    <circle cx="28" cy="356" r="170" fill="#3B82F6" opacity=".06"/>
    <path d="M0 302 C230 250 380 350 620 292 S970 250 1200 304" fill="none" stroke="#60A5FA" stroke-opacity=".09" stroke-width="2"/>
    <path d="M0 322 C250 276 400 364 630 316 S980 274 1200 326" fill="none" stroke="#60A5FA" stroke-opacity=".06"/>

    <g opacity=".25">
      <path d="M828 70h235M800 102h284M846 134h208M814 166h274" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 8"/>
      <circle cx="828" cy="70" r="3" fill="#60A5FA"/><circle cx="1063" cy="70" r="3" fill="#60A5FA"/>
      <circle cx="800" cy="102" r="3" fill="#60A5FA"/><circle cx="1084" cy="102" r="3" fill="#60A5FA"/>
      <circle cx="846" cy="134" r="3" fill="#60A5FA"/><circle cx="1054" cy="134" r="3" fill="#60A5FA"/>
    </g>

    <circle cx="130" cy="126" r="58" fill="#0B1220" stroke="#60A5FA" stroke-width="2"/>
    <image x="78" y="74" width="104" height="104" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar)" xlink:href="data:image/jpeg;base64,"/>

    <text x="224" y="105" fill="#60A5FA" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">HOLA, SOY</text>
    <text x="224" y="160" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="700">Luis Loayza</text>
    <text x="224" y="205" fill="#BFDBFE" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600">Fullstack Developer · UI/UX · Data &amp; IA</text>
    <text x="224" y="244" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="18">Convierto ideas complejas en productos digitales claros y funcionales.</text>
    <rect class="line" x="224" y="270" width="430" height="2" rx="1" fill="url(#line)"/>
    <text x="224" y="305" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="16">React  /  TypeScript  /  Node.js  /  PostgreSQL</text>
    <rect class="cursor" x="628" y="291" width="9" height="18" rx="2" fill="#60A5FA"/>

    <g transform="translate(887 230)">
      <rect width="245" height="52" rx="26" fill="#111827" stroke="#334155"/>
      <circle class="signal" cx="27" cy="26" r="12" fill="#22C55E"/>
      <circle class="pulse" cx="27" cy="26" r="6" fill="#22C55E"/>
      <text x="47" y="32" fill="#E2E8F0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Disponible para colaborar</text>
    </g>
  </g>
</svg>
