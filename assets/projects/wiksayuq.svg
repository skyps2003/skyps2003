<svg xmlns="http://www.w3.org/2000/svg" width="560" height="270" viewBox="0 0 560 270" role="img" aria-labelledby="title desc">
  <title id="title">WIKSAYUQ</title><desc id="desc">Tarjeta de la aplicación móvil de acompañamiento prenatal.</desc>
  <defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <style>
    .dot { animation: enter .45s .2s ease-out both; transform-box: fill-box; transform-origin: center; }
    @keyframes enter { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
  <rect x="1" y="1" width="558" height="268" rx="22" fill="url(#surface)" stroke="#263449" stroke-width="2"/>
  <rect x="1" y="1" width="558" height="6" rx="3" fill="#2563EB"/>
  <text x="34" y="50" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">WIKSAYUQ</text>
  <text x="34" y="75" fill="#60A5FA" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">ACOMPAÑAMIENTO PRENATAL</text>
  <text x="34" y="119" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="16">Aplicación móvil de seguimiento prenatal pensada</text>
  <text x="34" y="145" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="16">para comunidades ubicadas en zonas altoandinas.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#CBD5E1">
    <rect x="34" y="177" width="106" height="30" rx="15" fill="#172033"/><text x="87" y="197" text-anchor="middle">React Native</text>
    <rect x="148" y="177" width="70" height="30" rx="15" fill="#172033"/><text x="183" y="197" text-anchor="middle">Expo</text>
    <rect x="226" y="177" width="92" height="30" rx="15" fill="#172033"/><text x="272" y="197" text-anchor="middle">Supabase</text>
  </g>
  <line x1="34" y1="230" x2="526" y2="230" stroke="#263449"/>
  <circle class="dot" cx="43" cy="248" r="5" fill="#22C55E"/>
  <text x="57" y="253" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="13">Proyecto destacado</text>
  <text x="526" y="253" text-anchor="end" fill="#93C5FD" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">VER PROYECTO →</text>
</svg>
