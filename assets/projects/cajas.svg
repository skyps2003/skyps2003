<svg xmlns="http://www.w3.org/2000/svg" width="560" height="270" viewBox="0 0 560 270" role="img" aria-labelledby="title desc">
  <title id="title">Sistema Financiero Corporativo</title><desc id="desc">Tarjeta del sistema de gestión financiera multiempresa.</desc>
  <defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <style>
    .icon { animation: float 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .dot { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes float { to { transform: translateY(-4px); } } @keyframes pulse { 50% { opacity: .45; transform: scale(.8); } }
    @media (prefers-reduced-motion: reduce) { .icon,.dot { animation: none; } }
  </style>
  <rect x="1" y="1" width="558" height="268" rx="22" fill="url(#surface)" stroke="#263449" stroke-width="2"/>
  <rect x="1" y="1" width="558" height="6" rx="3" fill="#2563EB"/>
  <g class="icon" transform="translate(34 29)">
    <rect width="48" height="48" rx="14" fill="#172554" stroke="#1D4ED8"/>
    <path d="M14 18h20M17 15v20M24 15v20M31 15v20M14 35h20" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="98" y="50" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Sistema Financiero</text>
  <text x="98" y="75" fill="#60A5FA" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">GESTIÓN CORPORATIVA</text>
  <text x="34" y="119" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="16">Control centralizado de ingresos, egresos, cajas,</text>
  <text x="34" y="145" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="16">sedes y usuarios con permisos jerárquicos.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#CBD5E1">
    <rect x="34" y="177" width="72" height="30" rx="15" fill="#172033"/><text x="70" y="197" text-anchor="middle">React</text>
    <rect x="114" y="177" width="96" height="30" rx="15" fill="#172033"/><text x="162" y="197" text-anchor="middle">Node.js</text>
    <rect x="218" y="177" width="88" height="30" rx="15" fill="#172033"/><text x="262" y="197" text-anchor="middle">MongoDB</text>
  </g>
  <line x1="34" y1="230" x2="526" y2="230" stroke="#263449"/>
  <circle class="dot" cx="43" cy="248" r="5" fill="#22C55E"/>
  <text x="57" y="253" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="13">Proyecto destacado</text>
  <text x="526" y="253" text-anchor="end" fill="#93C5FD" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">VER PROYECTO →</text>
</svg>
