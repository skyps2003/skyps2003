<svg xmlns="http://www.w3.org/2000/svg" width="560" height="270" viewBox="0 0 560 270" role="img" aria-labelledby="title desc">
  <title id="title">Chat y videollamadas con IA</title><desc id="desc">Tarjeta de la plataforma de comunicación en tiempo real.</desc>
  <defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <style>
    .icon { animation: float 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .dot { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes float { to { transform: translateY(-4px); } } @keyframes pulse { 50% { opacity: .45; transform: scale(.8); } }
    @media (prefers-reduced-motion: reduce) { .icon,.dot { animation: none; } }
  </style>
  <rect x="1" y="1" width="558" height="268" rx="22" fill="url(#surface)" stroke="#263449" stroke-width="2"/>
  <rect x="1" y="1" width="558" height="6" rx="3" fill="#2563EB"/>
  <g class="icon" transform="translate(34 29)">
    <rect width="48" height="48" rx="14" fill="#172554" stroke="#1D4ED8"/>
    <path d="M14 15h20a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H23l-7 5v-5h-2a3 3 0 0 1-3-3V18a3 3 0 0 1 3-3Z" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="19" cy="24" r="1.5" fill="#93C5FD"/><circle cx="24" cy="24" r="1.5" fill="#93C5FD"/><circle cx="29" cy="24" r="1.5" fill="#93C5FD"/>
  </g>
  <text x="98" y="50" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Chat con IA</text>
  <text x="98" y="75" fill="#60A5FA" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">COMUNICACIÓN EN TIEMPO REAL</text>
  <text x="34" y="119" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="16">Mensajería, videollamadas, notas de voz, archivos</text>
  <text x="34" y="145" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="16">e integración de Gemini AI en una sola experiencia.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#CBD5E1">
    <rect x="34" y="177" width="72" height="30" rx="15" fill="#172033"/><text x="70" y="197" text-anchor="middle">MERN</text>
    <rect x="114" y="177" width="84" height="30" rx="15" fill="#172033"/><text x="156" y="197" text-anchor="middle">Socket.io</text>
    <rect x="206" y="177" width="82" height="30" rx="15" fill="#172033"/><text x="247" y="197" text-anchor="middle">WebRTC</text>
  </g>
  <line x1="34" y1="230" x2="526" y2="230" stroke="#263449"/>
  <circle class="dot" cx="43" cy="248" r="5" fill="#22C55E"/>
  <text x="57" y="253" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="13">Proyecto destacado</text>
  <text x="526" y="253" text-anchor="end" fill="#93C5FD" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">VER PROYECTO →</text>
</svg>
